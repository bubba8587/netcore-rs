[package]
name = "netcore-bench"
description = "Workloads timed against upstream rete by tools/bench/compare.mjs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "netcore-bench"
path = "src/main.rs"

[dependencies]
netcore = { path = "../crates/netcore" }
netcore-engine = { path = "../crates/netcore-engine" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints]
workspace = true
